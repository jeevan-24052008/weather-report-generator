<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Weather Report Generator</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: Inter, system-ui, -apple-system, Segoe UI, sans-serif;
      background: radial-gradient(circle at top, #243b53, #0b1220 60%);
      color: #fff;
    }
    .card {
      width: min(92vw, 520px);
      padding: 36px;
      border: 1px solid rgba(255,255,255,.14);
      border-radius: 24px;
      background: rgba(255,255,255,.08);
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(0,0,0,.35);
    }
    h1 { margin: 0 0 8px; font-size: 30px; }
    p { color: #c8d3df; margin: 0 0 26px; line-height: 1.5; }
    label { display: block; margin-bottom: 8px; font-size: 14px; color: #dce5ee; }
    input {
      width: 100%; padding: 14px 16px; border-radius: 12px;
      border: 1px solid rgba(255,255,255,.16); outline: none;
      background: rgba(0,0,0,.2); color: white; font-size: 16px;
    }
    input:focus { border-color: #9fc5ff; }
    button {
      width: 100%; margin-top: 14px; padding: 14px 16px;
      border: 0; border-radius: 12px; cursor: pointer;
      background: white; color: #101827; font-size: 16px; font-weight: 700;
    }
    button:hover { transform: translateY(-1px); }
    .error {
      margin-top: 16px; padding: 12px; border-radius: 10px;
      background: rgba(255, 90, 90, .15); color: #ffd2d2;
    }
    .footer { margin-top: 22px; font-size: 12px; color: #9eacbb; text-align: center; }
  </style>
</head>
<body>
  <main class="card">
    <h1>Weather Report Generator</h1>
    <p>Enter a city and download a professionally formatted weather report as a PDF.</p>
    <form action="/generate" method="post">
      <label for="city">City</label>
      <input id="city" name="city" value="{{ city or '' }}" placeholder="e.g. Chennai" autocomplete="address-level2" required>
      <button type="submit">Generate Weather PDF</button>
    </form>
    {% if error %}<div class="error">{{ error }}</div>{% endif %}
    <div class="footer">Powered by OpenWeatherMap · Python · FPDF</div>
  </main>
</body>
</html>
